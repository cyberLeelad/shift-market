<!doctype html>
<html lang="en">
  <!-- How the tab displays next to your other tabs -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shift Market</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>

  <!-- Web page -->
  <body>

    <!-- Reserving concept, atomized -->
    <h1>Claimed Shifts (Reserving concept, atomized)</h1>
    <form id="reserve">
      <input name="user" placeholder="Your kerberos" required />
      <input name="resource" placeholder="oct-11-6pm" required />
      <button>Create and claim</button>
    </form>
    <p id="status"></p>
    <ul id="reservations"></ul>

    <!-- Provisioning concept, atomized -->
    <h1>All Shifts (Provisioning concept, atomized)</h1>
    <form id="provision">
      <input name="date" type="date" placeholder="date, YYYY-MM-DD" required />
      <input name="start" type="time" placeholder="start time, e.g. 18:00" required />
      <input name="end" type="time" placeholder="end time, e.g. 03:00" required />
      <label><input name="isWeekly" type="checkbox" value="yes" checked />Weekly shift</label>
      <button>Create shift!</button>
    </form>
    <p id="provisionStatus"></p>
    <ul id="allShifts"></ul>

    <h1>Calendar View</h1>
    <div>
      <button id="prevWeek">◀ Prev</button>
      <span id="weekLabel"></span>
      <button id="nextWeek">Next ▶</button>
    </div>
    <div id="calendar"></div>

  </body>
</html>
